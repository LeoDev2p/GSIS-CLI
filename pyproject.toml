
[tool.ruff]
# Longitud de línea estándar
line-length = 120

[tool.ruff.lint]
# Selecciona las reglas: 'D' activa pydocstyle (docstrings)
# añadir "E" (estilo) y "F" (errores lógicos) para más seguridad
select = ["D", "E", "F"]

[tool.ruff.lint.pydocstyle]
# Configura Ruff para que use el formato de Google
convention = "google"
